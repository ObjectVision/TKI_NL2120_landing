<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      {{ with resources.Get "images/logo.svg" | minify | fingerprint }}<img class="brand-logo" src="{{ .RelPermalink }}" alt="" width="48" height="48">{{ end }}
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <nav class="main-nav" aria-label="Hoofdnavigatie">
      <ul>
        {{ range site.Menus.main }}
        {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
        <li><a href="{{ .URL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
