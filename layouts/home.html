{{ define "main" }}
<section class="hero">
  <div class="container hero-inner">
    <div class="hero-text">
      <h1>{{ .Title }}</h1>
      {{ with .Params.intro }}<p class="hero-intro">{{ . }}</p>{{ end }}
    </div>
    <div class="hero-art" aria-hidden="true">
      {{ with resources.Get "images/hero.svg" | minify | fingerprint }}<img src="{{ .RelPermalink }}" alt="" width="1696" height="916">{{ end }}
    </div>
  </div>
</section>

<section class="cards container" aria-label="Onderdelen">
  {{ range .Params.cards }}
  <article class="card">
    <h2>{{ .title }}</h2>
    <p>{{ .text }}</p>
    <a class="button" href="{{ .url | relURL }}">{{ .button }}</a>
  </article>
  {{ end }}
</section>
{{ end }}
